# Two SeaweedFS instances so migrating between stores can be tried locally.
# s3-a: http://localhost:9200, s3-b: http://localhost:9300, each with a "dbox" bucket.
# Both use dbox / dbox-secret. `tools/s3.sh` starts them.
services:
  s3-a:
    image: chrislusf/seaweedfs:4.52
    command: mini -dir=/data
    ports: ["9200:8333"]
    environment: &env
      AWS_ACCESS_KEY_ID: dbox
      AWS_SECRET_ACCESS_KEY: dbox-secret
      S3_BUCKET: dbox
    volumes: [s3-a:/data]
    healthcheck: &health
      test: ["CMD", "curl", "-so", "/dev/null", "http://localhost:8333/"]
      interval: 2s
      retries: 30

  s3-b:
    image: chrislusf/seaweedfs:4.52
    command: mini -dir=/data
    ports: ["9300:8333"]
    environment: *env
    volumes: [s3-b:/data]
    healthcheck: *health

volumes:
  s3-a:
  s3-b:
