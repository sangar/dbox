# Local development against the MinIOs from tools/minio.sh. Run with:
#   out/debug/dbox run --config dev.config.yml
stores:
  minio-a:
    kind: s3
    role: primary
    bucket: dbox
    region: us-east-1
    endpoint: http://localhost:9200
    path_style: true
    access_key: minioadmin
    secret_key: minioadmin

  minio-b:
    kind: s3
    role: mirror
    bucket: dbox
    region: us-east-1
    endpoint: http://localhost:9300
    path_style: true
    access_key: minioadmin
    secret_key: minioadmin

sync:
  root: ./tmp/box
  pull_interval: 5s

daemon:
  log_level: debug
  listen: 127.0.0.1:7878
