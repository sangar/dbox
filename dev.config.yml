# Local development against the SeaweedFS instances from tools/s3.sh. Run with:
#   out/debug/dbox run --config dev.config.yml
stores:
  s3-a:
    kind: s3
    role: primary
    bucket: dbox
    region: us-east-1
    endpoint: http://localhost:9200
    path_style: true
    access_key: dbox
    secret_key: dbox-secret

  s3-b:
    kind: s3
    role: mirror
    bucket: dbox
    region: us-east-1
    endpoint: http://localhost:9300
    path_style: true
    access_key: dbox
    secret_key: dbox-secret

sync:
  root: ./tmp/box
  pull_interval: 5s

daemon:
  log_level: debug
  listen: 127.0.0.1:7878
