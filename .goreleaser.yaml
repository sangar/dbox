version: 2
project_name: dbox

builds:
  - env: [CGO_ENABLED=0]
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags: ["-s -w -X main.version={{ .Version }}"]

archives:
  - formats: [tar.gz]
    files: [LICENSE, README.md]

nfpms:
  - package_name: dbox
    homepage: https://github.com/OWNER/dbox
    maintainer: Gard Sandholt <gard.sandholt@gmail.com>
    description: Keep a folder in sync with S3-compatible stores.
    license: MIT
    formats: [deb, rpm, apk, archlinux]
    contents:
      - src: packaging/dbox.service
        dst: /usr/lib/systemd/user/dbox.service
      - src: packaging/50-dbox.conf
        dst: /usr/lib/sysctl.d/50-dbox.conf
    scripts:
      postinstall: packaging/postinstall.sh
      preremove: packaging/preremove.sh

homebrew_casks:
  - repository:
      owner: OWNER
      name: homebrew-tap
    homepage: https://github.com/OWNER/dbox
    description: Keep a folder in sync with S3-compatible stores.
    license: MIT
    binaries: [dbox]
    caveats: |
      Write ~/.config/dbox/config.yml, then keep dbox running from login with:
        dbox service enable
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/dbox"]
          end
    zap:
      trash:
        - "~/Library/LaunchAgents/dbox.plist"
        - "~/Library/Logs/dbox.log"
        - "~/.config/dbox"

changelog:
  use: git
